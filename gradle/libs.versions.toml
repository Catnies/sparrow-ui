[versions]
project-version = "beta.11"
kotlin = "2.3.10"
paper-api = "1.21.8-R0.1-SNAPSHOT"

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version = "9.3.2" }

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
sparrow-reflection = { module = "net.momirealms:sparrow-reflection", version = "0.34" }
netty-transport = { module = "io.netty:netty-transport", version = "4.2.7.Final" }

asm = { module = "org.ow2.asm:asm", version = "9.9.1" }
datafixerupper = { module = "com.mojang:datafixerupper", version = "8.0.16" }
gson = { module = "com.google.code.gson:gson", version = "2.13.2" }
jspecify = { module = "org.jspecify:jspecify", version = "1.0.0" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "26.0.2" }
junit-bom = { module = "org.junit:junit-bom", version = "6.0.1" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v1.21", version = "4.93.0" }
test-paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
